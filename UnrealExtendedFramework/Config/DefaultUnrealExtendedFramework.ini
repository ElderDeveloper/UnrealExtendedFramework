[CoreRedirects]
; When a UCLASS, USTRUCT, UENUM or UFUNCTION is renamed or moved, add a redirect here so existing
; Blueprints and assets keep loading, e.g.:
; +ClassRedirects=(OldName="/Script/UnrealExtendedFramework.EFOldName",NewName="/Script/UnrealExtendedFramework.EFNewName")

; Libraries/Array: UUEFArrayLibrary was renamed UEFArrayLibrary (EFArrayLibrary.h).
+ClassRedirects=(OldName="/Script/UnrealExtendedFramework.UEFArrayLibrary",NewName="/Script/UnrealExtendedFramework.EFArrayLibrary")
