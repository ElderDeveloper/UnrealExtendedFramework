[FilterPlugin]
; This section lists additional files which will be packaged along with your plugin. Paths should be listed relative to the root plugin directory, and
; may include "...", "*", and "?" wildcards to match directories, files, and individual characters respectively.
;
; Examples:
;    /README.txt
;    /Extras/...
;    /Binaries/ThirdParty/*.dll

; Backlot's native Slate style resolves these files directly from the installed plugin directory.
; List them explicitly so BuildPlugin distributions always contain the offline fonts, OFL
; attribution, SVG brushes, and icon provenance even though CanContainContent is false.
/Resources/Fonts/...
/Resources/Icons/...
