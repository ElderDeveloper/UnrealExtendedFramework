[CoreRedirects]
; The HTTP and JSON backend moved from the UnrealExtendedFramework module into ExtendedFoundation.
+ClassRedirects=(OldName="/Script/UnrealExtendedFramework.EFHttpSubsystem",NewName="/Script/ExtendedFoundation.EFHttpSubsystem")
+ClassRedirects=(OldName="/Script/UnrealExtendedFramework.EFHttpLibrary",NewName="/Script/ExtendedFoundation.EFHttpLibrary")
+ClassRedirects=(OldName="/Script/UnrealExtendedFramework.EFAsyncHttpRequest",NewName="/Script/ExtendedFoundation.EFAsyncHttpRequest")
+ClassRedirects=(OldName="/Script/UnrealExtendedFramework.EFJsonLibrary",NewName="/Script/ExtendedFoundation.EFJsonLibrary")
+StructRedirects=(OldName="/Script/UnrealExtendedFramework.EFJsonObject",NewName="/Script/ExtendedFoundation.EFJsonObject")
+StructRedirects=(OldName="/Script/UnrealExtendedFramework.EFJsonValue",NewName="/Script/ExtendedFoundation.EFJsonValue")
+StructRedirects=(OldName="/Script/UnrealExtendedFramework.EFHttpRequest",NewName="/Script/ExtendedFoundation.EFHttpRequest")
+StructRedirects=(OldName="/Script/UnrealExtendedFramework.EFHttpResponse",NewName="/Script/ExtendedFoundation.EFHttpResponse")
+StructRedirects=(OldName="/Script/UnrealExtendedFramework.EFHttpRequestHandle",NewName="/Script/ExtendedFoundation.EFHttpRequestHandle")
+EnumRedirects=(OldName="/Script/UnrealExtendedFramework.EEFJsonType",NewName="/Script/ExtendedFoundation.EEFJsonType")
+EnumRedirects=(OldName="/Script/UnrealExtendedFramework.EEFHttpVerb",NewName="/Script/ExtendedFoundation.EEFHttpVerb")
+EnumRedirects=(OldName="/Script/UnrealExtendedFramework.EEFHttpResult",NewName="/Script/ExtendedFoundation.EEFHttpResult")
; The original EB-prefixed backend types.
+ClassRedirects=(OldName="/Script/UnrealExtendedFramework.EBHttpSubsystem",NewName="/Script/ExtendedFoundation.EFHttpSubsystem")
+StructRedirects=(OldName="/Script/UnrealExtendedFramework.ExtendedJson",NewName="/Script/ExtendedFoundation.EFJsonObject")
